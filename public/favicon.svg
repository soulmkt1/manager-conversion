<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 압구정 TOP LINE 브랜드: 검은 배경 + T(흰색, TOP) / L(보라, LINE) -->
  <rect width="64" height="64" rx="12" fill="#000000"/>
  <!-- T (흰색) -->
  <rect x="10" y="16" width="22" height="6" fill="#ffffff"/>
  <rect x="18" y="16" width="6"  height="32" fill="#ffffff"/>
  <!-- L (보라) -->
  <rect x="36" y="16" width="6"  height="32" fill="#a855f7"/>
  <rect x="36" y="42" width="18" height="6"  fill="#a855f7"/>
</svg>
